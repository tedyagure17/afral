services:

  db:
    image: postgres:17

    restart: always

    env_file:
      - .env

    volumes:
      - postgres_data:/var/lib/postgresql/data

    ports:
      - "5432:5432"

  web:

    build:
      context: .
      dockerfile: docker/django/Dockerfile

    command: python backend/manage.py runserver 0.0.0.0:8000

    volumes:
      - .:/app

    ports:
      - "8000:8000"

    depends_on:
      - db

    env_file:
      - .env

volumes:
    postgres_data: